name: Upstream Pin Monitoring

on:
  schedule:
    - cron: 17 15 * * 1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    name: Confirm pin is current
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Compare pin with newest upstream commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/check-pin.sh
