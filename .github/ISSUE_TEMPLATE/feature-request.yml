name: Request a feature
description: Propose a new capability for TDLib Oracle.
title: "feat: <short description>"
labels: [feat, triage]
body:
  - type: checkboxes
    id: preflight-checks
    attributes:
      label: Before submitting
      options:
        - label: >-
            The feature is not already proposed in
            [open issues](https://github.com/theodiv/tdlib-oracle/issues?q=is:issue+state:open).
          required: true
        - label: >-
            The feature fits the project's scope: reproducing the pinned Bot API
            server's handling of a bot's formatted text.
          required: true

  - type: input
    id: version
    attributes:
      label: TDLib Oracle version
      description: Output of `pip show tdlib-oracle`.
    validations:
      required: true

  - type: textarea
    id: problem-statement
    attributes:
      label: Problem statement
      description: The capability gap, then what it costs.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: >-
        The behavior the feature should have, in prose; no code or
        configuration blocks.
    validations:
      required: true

  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives considered
      description: The workaround in use and its limitation.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Specifications or comparable tools.
    validations:
      required: false

  - type: checkboxes
    id: contribution-intent
    attributes:
      label: Contribution intent
      options:
        - label: >-
            A pull request implementing this feature is planned or already
            in progress.
          required: false
